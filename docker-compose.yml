version: '3.8'

services:
  updater:
    build:
      context: .
      dockerfile: Dockerfile
    image: edustartech/edustartech:app-release-manager
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      # Mount the SQLite database to persist releases across container restarts
      - ./updater.db:/app/updater.db
    restart: unless-stopped
