version: '3.8'

services:
  updater:
    build:
      context: .
      dockerfile: Dockerfile
    image: edustartech/edustartech:app-release-manager
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///app/data/updater.db
    volumes:
      # Mount a Docker volume for the database
      - updater_data:/app/data
    restart: unless-stopped

volumes:
  updater_data:
